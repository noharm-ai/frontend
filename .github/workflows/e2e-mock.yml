name: Mocked e2e tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    # Each shard is ~3-4 min against a production build on 4 workers. This
    # is a ceiling for a hung run, not a budget.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      # one shard failing must not cancel the others: their failures are
      # part of the report too
      fail-fast: false
      matrix:
        # The whole suite took 6-8 min in one job, nearly all of it running
        # tests (setup is ~1 min). Playwright splits by test count, which
        # comes out even in time here: the specs are fully parallel. Add a
        # number to add a shard.
        shard: [1, 2]
    env:
      VITE_APP_URL: http://localhost:3000
      VITE_APP_API_URL: http://localhost:5001
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies
        run: sfw npm ci --ignore-scripts

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Serve a production build instead of the dev server: with the backend
      # mocked, page loads are the bottleneck, and the dev server serves
      # every module unbundled to each test's fresh browser context. The
      # `build` workflow already runs the TypeScript check, so vite build
      # alone is enough here.
      - name: Build app
        run: npx vite build

      # npx (not sfw npm run): the sfw wrapper injects proxy env vars that
      # break Playwright's webServer startup probe (same pattern as
      # playwright-test.yml). --workers=4 matches the runner's 4 vCPUs; the
      # mocked specs share no state, so they parallelize freely. The
      # mock-setup login runs in every shard.
      - name: Run mocked e2e tests
        env:
          E2E_PREVIEW: "1"
        run: >-
          npx playwright test --project=mock-setup --project=chromium-mocked
          --workers=4 --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-mocked-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 15

  # Keeps a single "test" check, green only when every shard passed, so
  # branch protection does not depend on the number of shards.
  test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        if: needs.shard.result != 'success'
        run: |
          echo "A shard ended as: ${{ needs.shard.result }}"
          exit 1
      - run: echo "All shards passed"
